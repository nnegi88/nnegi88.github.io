---
layout: default
---
<p class="subtitle" style="font-style:normal;margin-bottom:2rem;">{{ site.description }}</p>

<ul class="post-list">
{%- for post in site.posts %}
  <li>
    <a class="t" href="{{ post.url | relative_url }}">{{ post.title }}</a>
    <span class="d">{{ post.date | date: "%-d %B %Y" }}{% if post.subtitle %} &middot; {{ post.subtitle | truncate: 90 }}{% endif %}</span>
  </li>
{%- else %}
  <li><span class="d">Nothing published yet.</span></li>
{%- endfor %}
</ul>
